name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC, so breakage in upstream packages shows up

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Tests (bundled sample)
        run: make smoke
      - name: One-command run
        run: make run
      # README "Run it", steps 2 and 3, as written
      - name: Run it, steps 2 and 3
        run: |
          make run | tee /tmp/run.txt
          grep -q "missing pieces exactly right 1.0 (12 cycles)" /tmp/run.txt
          grep -q "precision 0.75, recall 1.0 (3 complete rockets flagged" /tmp/run.txt
          make cycle CYCLE=14 | tee /tmp/cycle.txt
          grep -q "1            body2     85.6 s  nothing" /tmp/cycle.txt
          grep -q "(cycle shifted +6.8 s)" /tmp/cycle.txt
      - name: Use your own data (file checks)
        run: uv run --frozen pytest -q tests/test_own_data.py
      - name: Try this 1 to 3
        run: |
          make try-sample-rate | tee /tmp/try1.txt
          grep -qE "^ +1 Hz +3,617 +6.0 +30 +1.00 +1.00 +1.00$" /tmp/try1.txt
          make try-load-threshold | tee /tmp/try2.txt
          grep -qE "^ +3,000 +30 +1.00 +1.00 +1.00  \(config/pipeline.json\)$" /tmp/try2.txt
          make try-signal-groups | tee /tmp/try3.txt
          grep -qE "^process-aware \(R03 grasps\) +1 +9 +0 +1.00 +1.00" /tmp/try3.txt
      - name: pip install -r requirements.txt, then the scripts
        run: |
          uv venv --seed --python ${{ matrix.python-version }} /tmp/pipenv
          /tmp/pipenv/bin/python -m pip install -q -r requirements.txt
          /tmp/pipenv/bin/python demo_pipeline.py --data sample
          /tmp/pipenv/bin/python demo_pipeline.py --data sample --step 6
          /tmp/pipenv/bin/python cloud_demo.py --data sample --step 4
          /tmp/pipenv/bin/python download_data.py --help > /dev/null

  kafka:
    # The Kafka transport against a real broker (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Start Kafka
        run: docker compose up -d --wait kafka
      - name: The pipeline through Kafka
        run: |
          uv sync --python 3.12
          uv run python demo_pipeline.py --data sample --transport kafka --step 6 | tee /tmp/run.log
          grep -q "Stream:    kafka" /tmp/run.log
          grep -q "missing pieces exactly right 1.0" /tmp/run.log
      # README "Run it", step 4
      - name: Run it, step 4 (make run-kafka)
        run: |
          make run-kafka | tee /tmp/kafka.txt
          grep -q "Stream:    kafka" /tmp/kafka.txt
          grep -q "missing pieces exactly right 1.0 (12 cycles)" /tmp/kafka.txt
      - name: Kafka logs
        if: failure()
        run: docker compose logs kafka

  devcontainer:
    # Builds .devcontainer/ the way Codespaces does and runs the playbook inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the devcontainer and run the playbook
        uses: devcontainers/ci@v0.3
        with:
          push: never
          # make run, then the Docker services, to prove Docker-in-Docker works in Codespaces
          runCmd: start=$(date +%s) && make run && echo "Time to first output in a clean devcontainer was $(( $(date +%s) - start )) s" && make run-kafka && make kafka-down
